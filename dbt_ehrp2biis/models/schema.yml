version: 2

models:
  # ---------------------------------------------------------------- staging
  - name: stg_nwk_new_ehrp_actions
    description: Trigger rows from NKNIGHT.NWK_NEW_EHRP_ACTIONS_TBL - the EHRP actions to process in this run.
    columns:
      - name: emplid
        data_tests: [not_null]
      - name: effdt
        data_tests: [not_null]

  - name: stg_ps_gvt_job
    description: >
      SQ_PS_GVT_JOB - PS_GVT_JOB rows matching the trigger table on EMPLID, EMPL_RCD, EFFDT and EFFSEQ,
      with the column list of the Informatica SQL override.
    columns:
      - name: emplid
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_nwk_new_ehrp_actions')
                field: emplid

  # ---------------------------------------------------------------- intermediate
  - name: int_sequence_generation
    description: Every staged action plus its EFFDT year, the year's last used sequence number and the new event ID.
    columns:
      - name: event_id
        data_tests: [unique, not_null]
      - name: ehrp_seq_number
        description: NULL means the EFFDT year is missing from NKNIGHT.SEQUENCE_NUM_TBL.
        data_tests: [not_null]

  - name: int_employee_enrichment
    description: Actions LEFT JOINed to the eight PeopleSoft lookups (one row per action).
    columns:
      - name: event_id
        data_tests: [unique, not_null]
      - name: emplid
        data_tests: [not_null]

  # ---------------------------------------------------------------- marts
  - name: fct_action_primary
    description: NWK_ACTION_PRIMARY_TBL - one row per action, 260 columns in target order (generated from the mapping).
    columns:
      - name: event_id
        data_tests: [unique, not_null]
      - name: emp_id
        description: EMPLID
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_nwk_new_ehrp_actions')
                field: emplid
      - name: load_date
        data_tests: [not_null]
      - name: us_citizenship_cd
        data_tests:
          - accepted_values:
              arguments:
                values: ['1', '8']
      - name: ann_lv_crdt_reductn_hrs
        description: Zero-to-null (source HE_AL_RED_CRED).
        data_tests:
          - no_zero_values
      - name: ann_lv_cur_bal_hrs
        description: Zero-to-null (source HE_AL_BALANCE).
        data_tests:
          - no_zero_values
      - name: ann_lv_lump_sum_paid_hrs
        description: Zero-to-null (source HE_LUMP_HRS).
        data_tests:
          - no_zero_values
      - name: ann_lv_prior_year_bal_hrs
        description: Zero-to-null (source HE_AL_CARRYOVER).
        data_tests:
          - no_zero_values
      - name: ann_lv_restored_bal_lv_hrs
        description: Zero-to-null (source HE_RES_BALANCE).
        data_tests:
          - no_zero_values
      - name: ann_lv_restored_bal1_hrs
        description: Zero-to-null (source HE_RES_LASTYR).
        data_tests:
          - no_zero_values
      - name: ann_lv_restored_bal2_hrs
        description: Zero-to-null (source HE_RES_TWOYRS).
        data_tests:
          - no_zero_values
      - name: ann_lv_ytd_used_hrs
        description: Zero-to-null (source HE_AL_TOTAL).
        data_tests:
          - no_zero_values
      - name: appt_lmt_nte_hrs
        description: Zero-to-null (source GVT_APPT_LIMIT_HRS).
        data_tests:
          - no_zero_values
      - name: awop_ytd_hrs
        description: Zero-to-null (source HE_AWOP_SEP).
        data_tests:
          - no_zero_values
      - name: lwop_awop_wgi_hrs
        description: Zero-to-null (source HE_AWOP_WIGI).
        data_tests:
          - no_zero_values
      - name: reemp_annuitant_hrly_rate_amt
        description: Zero-to-null (source GVT_ANNUITY_OFFSET).
        data_tests:
          - no_zero_values
      - name: reemp_annuitant_monthly_amt
        description: Zero-to-null (source GVT_ANNUITY_OFFSET).
        data_tests:
          - no_zero_values
      - name: sick_lv_crdt_reductn_hrs
        description: Zero-to-null (source HE_SL_RED_CRED).
        data_tests:
          - no_zero_values
      - name: sick_lv_cur_bal_hrs
        description: Zero-to-null (source HE_SL_BALANCE).
        data_tests:
          - no_zero_values
      - name: sick_lv_fers_elect_bal_hrs
        description: Zero-to-null (source HE_FROZEN_SL).
        data_tests:
          - no_zero_values
      - name: sick_lv_prior_year_bal_hrs
        description: Zero-to-null (source HE_SL_CARRYOVER).
        data_tests:
          - no_zero_values
      - name: sick_lv_ytd_accrd_hrs
        description: Zero-to-null (source HE_SL_ACCRUAL).
        data_tests:
          - no_zero_values
      - name: sick_lv_ytd_used_hrs
        description: Zero-to-null (source HE_SL_TOTAL).
        data_tests:
          - no_zero_values
      - name: year_degree_attained_dte
        description: Zero-to-null (source JPM_INTEGER_2).
        data_tests:
          - no_zero_values

  - name: fct_action_secondary
    description: NWK_ACTION_SECONDARY_TBL - TSP, leave, bonus and retained-grade details (209 columns, generated).
    columns:
      - name: event_id
        data_tests:
          - unique
          - not_null
          - relationships:
              arguments:
                to: ref('fct_action_primary')
                field: event_id

  - name: fct_tracking
    description: EHRP_RECS_TRACKING_TBL - action key, WIP status and the BIIS event ID it was loaded as.
    columns:
      - name: biis_event_id
        data_tests:
          - unique
          - not_null
          - relationships:
              arguments:
                to: ref('fct_action_primary')
                field: event_id
      - name: emplid
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_nwk_new_ehrp_actions')
                field: emplid

  - name: hist_action_primary
    description: ACTION_PRIMARY_ALL - accumulated primary actions (incremental, delete+insert on event_id).
    columns:
      - name: event_id
        data_tests: [unique, not_null]

  - name: hist_action_secondary
    description: ACTION_SECONDARY_ALL - accumulated secondary actions (incremental, delete+insert on event_id).
    columns:
      - name: event_id
        data_tests: [unique, not_null]

  # ---------------------------------------------------------------- validation
  - name: reconciliation_report
    description: Row counts per layer against the Source Qualifier baseline, with PASS / FAIL / INFO status.
    columns:
      - name: status
        data_tests:
          - accepted_values:
              arguments:
                values: ['PASS', 'INFO']
